<!doctype html>
<html>

<head>
    <title>Day 01</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv"></canvas>
    <script>
        const canvas = document.querySelector("#canv")
        const ctx = canvas.getContext("2d")

        class Vector2 {
            x
            y
        }

        //Starting position of my character
        let position = new Vector2()
        let position2 = new Vector2()

        function start() {
            position.x = 0
            position.y = 0

            position2.x = 100
            position2.y = 100

            gameLoop()
        }

        function gameLoop() {
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        function update() {
            position.x++
            position.y++

            position2.x++
            position2.y++
        }

        function draw() {

            canvas.width = window.innerWidth
            canvas.height = window.innerHeight



            //Draw the first character
            ctx.save()
            ctx.translate(position.x, position.y)

            ctx.beginPath()
            ctx.moveTo(110, 90)
            ctx.lineTo(145, 100)
            ctx.lineTo(145, 90)
            ctx.lineTo(155, 90)
            ctx.lineTo(155, 100)
            ctx.lineTo(190, 90)
            ctx.lineTo(200, 140)
            ctx.lineTo(175, 150)
            ctx.lineTo(150, 140)
            ctx.lineTo(125, 150)
            ctx.lineTo(100, 140)
            ctx.lineTo(110, 90)


            ctx.lineWidth = 5
            ctx.strokeStyle = "purple"
            ctx.stroke()

            ctx.fillStyle = "red"
            ctx.fill()
            ctx.restore()

            //Draw the second character
            ctx.save()
            ctx.translate(position2.x, position2.y)

            ctx.beginPath()
            ctx.moveTo(110, 90)
            ctx.lineTo(145, 100)
            ctx.lineTo(145, 90)
            ctx.lineTo(155, 90)
            ctx.lineTo(155, 100)
            ctx.lineTo(190, 90)
            ctx.lineTo(200, 140)
            ctx.lineTo(175, 150)
            ctx.lineTo(150, 140)
            ctx.lineTo(125, 150)
            ctx.lineTo(100, 140)
            ctx.lineTo(110, 90)


            ctx.lineWidth = 5
            ctx.strokeStyle = "teal"
            ctx.stroke()

            ctx.fillStyle = "orange"
            ctx.fill()
            ctx.restore()

        }

        start()
    </script>
</body>

</html>
