<!doctype html>
<html>

<head>
  <title>Cards Game</title>
  <style>
    /* Engine-Specific */
    * {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <canvas id="canv"></canvas>
  <script type="module">
    import "../engine/Engine.js"
    import "../engine/Scene.js"
    import "../engine/GameObject.js"
    import "../engine/Component.js"
    import "../engine/Input.js"
    import "../engine/Vector2.js"
    import "../engine/Time.js"
    import "../engine/Collisions.js"
    import "../engine/SceneManager.js"

    import "../engine/components/Transform.js"
    import "../engine/components/TextLabel.js"
    import "../engine/components/Polygon.js"
    import "../engine/components/Collider.js"

    class MainScene extends Scene {
      constructor() {
        super()
        this.instantiate(new CardGameObject(), new Vector2(200, 200))
        this.instantiate(new CardGameObject(), new Vector2(250, 220))
        this.instantiate(new CardGameObject(), new Vector2(300, 240))
        this.instantiate(new CardGameObject(), new Vector2(350, 260))
      }
    }

    class CardGameObject extends GameObject {
      constructor() {
        super("CardGameObject")
        this.addComponent(new Polygon(), { points: [new Vector2(-50, -70), new Vector2(50, -70), new Vector2(50, 70), new Vector2(-50, 70)], fillStyle: "grey", strokeStyle: "black", lineWidth: 10 })
        this.addComponent(new Collider())
        this.addComponent(new CardController())
      }
    }

    class CardController extends Component {
      onMouseDrag() {
        this.transform.position = this.transform.position.add(Input.mousePositionDelta)
      }
    }

    SceneManager.currentScene = new MainScene()
    Engine.start()
  </script>
</body>

</html>
